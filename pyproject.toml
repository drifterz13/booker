[project]
name = "booker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drifterz13", email = "mixmyxxe@gmail.com" }
]
requires-python = ">=3.11.4"
dependencies = [
    "chainlit>=2.12.0",
    "chromadb>=1.0.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
