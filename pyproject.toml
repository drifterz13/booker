[project]
name = "booker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drifterz13", email = "mixmyxxe@gmail.com" }
]
requires-python = ">=3.11.4"
dependencies = [
    "chromadb>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "langchain-xai>=1.3.0",
    "pymupdf>=1.28.2",
    "pydantic>=2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
booker = "booker:main"

[dependency-groups]
dev = ["ruff>=0.16.9"]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
